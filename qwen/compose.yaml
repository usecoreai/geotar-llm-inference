services:
  vllm:
    image: vllm/vllm-openai:v0.27.1
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/root/.cache
    command: ["--model", "Qwen/Qwen3.8-27B-FP8", "--language-model-only", "--reasoning-parser", "qwen3", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
