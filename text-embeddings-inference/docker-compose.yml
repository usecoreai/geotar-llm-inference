services:
  embeddings:
    image: vllm/vllm-openai:v0.27.1
    ipc: host
    command:
      - --model=BAAI/bge-m3
      - --host=0.0.0.0
      - --port=80
      - --runner=pooling
      - --dtype=half
      - --enforce-eager
      - --gpu-memory-utilization=0.7
      - --swap-space=1
      - --max-model-len=8192
      - --max-num-seqs=32
      - --max-num-batched-tokens=16384
    environment:
      HF_HOME: /data
    ports:
      - "8888:80"
    volumes:
      - hf_cache:/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

volumes:
  hf_cache:
